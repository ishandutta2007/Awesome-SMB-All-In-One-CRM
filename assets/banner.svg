<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
    .pill-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #a855f7; }
    
    /* Animations */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.7; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-circle { animation: pulse 6s infinite ease-in-out; transform-origin: 1000px 180px; }
    .float-card-1 { animation: float1 5s infinite ease-in-out; }
    .float-card-2 { animation: float2 6s infinite ease-in-out; }
    .dash-line { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M0 40H1200 M0 80H1200 M0 120H1200 M0 160H1200 M0 200H1200 M0 240H1200 M0 280H1200 M0 320H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V360 M200 0V360 M300 0V360 M400 0V360 M500 0V360 M600 0V360 M700 0V360 M800 0V360 M900 0V360 M1000 0V360 M1100 0V360" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic / Background Ambient Animated Graphics (Positioned to Background) -->
  <circle class="animated-circle" cx="1000" cy="180" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle class="animated-circle" cx="850" cy="100" r="90" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Connection Line -->
  <path class="dash-line" d="M 750 260 Q 900 120 1100 220" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />

  <!-- Visual Accent Floating Cards in Background/Right Side -->
  <g class="float-card-1">
    <rect x="820" y="80" width="280" height="90" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <circle cx="855" cy="115" r="16" fill="#6366f1" opacity="0.8" />
    <path d="M849 115 L853 119 L861 111" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="885" y="105" width="120" height="8" rx="4" fill="#ffffff" opacity="0.8" />
    <rect x="885" y="122" width="160" height="6" rx="3" fill="#94a3b8" opacity="0.5" />
    <rect x="885" y="140" width="80" height="14" rx="7" fill="#6366f1" opacity="0.3" />
  </g>

  <g class="float-card-2">
    <rect x="760" y="200" width="310" height="100" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <path d="M 790 265 L 830 240 L 870 250 L 910 225 L 950 235 L 1030 215" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" />
    <circle cx="1030" cy="215" r="5" fill="#ec4899" />
    <rect x="790" y="218" width="140" height="10" rx="5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Left Accent Bar -->
  <rect x="60" y="65" width="6" height="230" rx="3" fill="url(#accentGrad)" />

  <!-- FOREGROUND TEXT & CONTENT (Unobscured & High Contrast) -->
  <!-- Top Category Pill -->
  <g>
    <rect x="85" y="65" width="260" height="28" rx="14" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <text x="100" y="84" class="pill-text">🚀 AWESOME ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="85" y="145" class="title">Awesome SMB All-In-One CRM</text>

  <!-- Subtitle -->
  <text x="85" y="185" class="subtitle">Top Commercial SaaS Platforms &amp; Self-Hosted Open-Source CRMs</text>
  <text x="85" y="210" class="subtitle" font-size="16px" opacity="0.8">Sales Pipelines • Invoicing • Contact Management • Automation</text>

  <!-- Feature Tags / Badges -->
  <g transform="translate(85, 245)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="150" height="32" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="15" y="20" class="badge-text">💼 Commercial SaaS</text>

    <!-- Badge 2 -->
    <rect x="162" y="0" width="165" height="32" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="177" y="20" class="badge-text">⚡ Open-Source Suites</text>

    <!-- Badge 3 -->
    <rect x="339" y="0" width="165" height="32" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="354" y="20" class="badge-text">📊 Market Analysis</text>
  </g>
</svg>
